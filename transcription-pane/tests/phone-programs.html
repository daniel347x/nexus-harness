      favTitlesIn(groupOf('Running now')).includes('Favorite running full'));
    favCycle.click();
    check('Favorite programs: the second tap (fold to active) leaves it folded, with only Running now drawing full active work',
      await until(()=>favCycle.textContent==='Collapse')&&section('Favorite programs')==='false'&&section('Running now')==='true'&&
      favTitlesIn(groupOf('Running now')).includes('Favorite running full')&&favTitlesIn(groupOf('Running now')).includes('Favorite running quick'));
    const favPaged=[];
    for(let i=1;i<=14;i++){
      const core='FAVP'+String(i).padStart(2,'0'),title='Paged favorite '+i;
      favPaged.push(title);fx.extra.push(favSeat(60+i,core,title,true,9000+i,{lifecycle:'ended'}));
      fx.pins['program:'+core]={pinned_at:10+i};
    }
    await redraw(()=>!!groupOf('Quick programs'));
    Object.assign(fx.history.state.stars,fx.pins);fx.history.inventory();await click(favGroup().querySelector('h3'),()=>section('Favorite programs')==='true');
    check('Favorite programs: every favorite is drawn on the phone (17 programs here, past the usual twelve) with no Show more foot',
      favPaged.every(t=>favTitlesIn(favGroup()).includes(t))&&!favGroup().querySelector('.group-foot')&&
      favGroup().querySelectorAll(':scope > .program').length===17&&favGroup().querySelectorAll(':scope > .session-stub').length===2);
    check('Favorite programs: the favorite work made no page error or rejection',fx.errors.length===0);
    // ---- U4.5 host load caption on the phone: the same static line inside .side-top, painted from the FIRST
    // inventory page only. A later continuation carrying a different snapshot must neither repaint nor clear it.
    const loadNode=()=>d.getElementById('sessions-host-load'),loadTop=d.querySelector('aside .side-top');
    const loadText=()=>loadNode()?loadNode().textContent:'';
    const loadHidden=()=>!!loadNode()&&(loadNode().hidden===true||getComputedStyle(loadNode()).display==='none'||getComputedStyle(loadNode()).visibility==='hidden');
    const loadShown=()=>!!loadNode()&&!loadHidden()&&loadText()!=='';
    const loadCleared=()=>!!loadNode()&&loadHidden()&&loadText()==='';
    const loadRects=()=>{const r=d.createRange();r.selectNodeContents(loadNode());return [...r.getClientRects()];};
    const loadOneLine=()=>loadRects().length===1&&loadRects()[0].right<=loadTop.getBoundingClientRect().right+1;
    const loadNeutral=()=>!loadNode().querySelector('button,select,input,a,textarea')&&loadNode().getAttribute('role')!=='alert'&&
      loadNode().dataset.error!=='true'&&!loadNode().classList.contains('error');
    const loadControls=()=>[...d.querySelectorAll('.side-top .side-bar button, .side-top .side-bar select')].map(n=>[n.id,n.disabled]);
    const loadControlsBefore=loadControls(),loadPostsBefore=fx.pinPosts.length,loadReadsBefore=fx.requests.length;
    const loadStep=async(hostLoad,expectShown,expectText)=>{
      await until(()=>fx.history.state.inventoryBusy===false);
      fx.hostLoad=hostLoad;const pages=fx.sessionPages.length;$('sessions-refresh').click();
      return until(()=>fx.sessionPages.length>=pages+2&&fx.history.state.inventoryBusy===false&&loadShown()===expectShown&&loadText()===expectText);
    };
    check('host load (phone 390 px): the page carries exactly one static caption line inside .side-top, and no dialog is involved',
      d.querySelectorAll('#sessions-host-load').length===1&&loadNode().closest('.side-top')===loadTop&&!d.querySelector('[role=dialog],dialog'));
    fx.laterHostLoad={rows_behind_sets:0,loop_lag_ms_max_60s:9000};
    check('host load (phone): the first page paints "host catching up · 2 conversations" while the later page says the opposite — one neutral own line inside .side-top',
      await loadStep({rows_behind_sets:2,loop_lag_ms_max_60s:1800},true,'host catching up · 2 conversations')&&
      loadOneLine()&&loadNeutral()&&d.documentElement.scrollWidth<=d.documentElement.clientWidth+1);
    fx.laterHostLoad=undefined;
    check('host load (phone): exactly 1000 ms is not busy; the line is hidden and empty',
      await loadStep({rows_behind_sets:0,loop_lag_ms_max_60s:1000},false,'')&&loadCleared());
    check('host load (phone): no debt and loop lag above 1000 ms reads "host busy · lag 2.5 s"',
      await loadStep({rows_behind_sets:0,loop_lag_ms_max_60s:2500},true,'host busy · lag 2.5 s')&&loadOneLine()&&loadNeutral());
    check('host load (phone): catch-up wins over lag, and one is still "conversations"',
      await loadStep({rows_behind_sets:1,loop_lag_ms_max_60s:2500},true,'host catching up · 1 conversations'));
    check('host load (phone): an older host with no hostLoad field leaves no caption',
      await loadStep(undefined,false,'')&&loadCleared());
    check('host load (phone): a fresh behind-set answer repaints the line',
      await loadStep({rows_behind_sets:4,loop_lag_ms_max_60s:0},true,'host catching up · 4 conversations'));
    // A failed first page clears it: no stale line from the last good read.
    const loadOkFetch=w.fetch;
    w.fetch=async(url,opts)=>String(url).startsWith('/api/claude/sessions')&&!/[?&]role=Manager\b/.test(String(url))&&!/[?&]live=1\b/.test(String(url))
      ?new Response('{}',{status:503}):loadOkFetch(url,opts);
    $('sessions-refresh').click();
    check('host load (phone): a failed inventory read clears the caption instead of leaving a stale one',
      await until(()=>fx.history.state.inventoryBusy===false&&loadCleared()&&/List unavailable/.test($('sessions-status').textContent)));
    w.fetch=loadOkFetch;
    check('host load (phone): the caption work disabled no side-bar control and posted nothing',
      JSON.stringify(loadControls())===JSON.stringify(loadControlsBefore)&&fx.pinPosts.length===loadPostsBefore);
    const loadNewRequests=fx.requests.slice(loadReadsBefore);
    check('host load (phone): no new health/load route, every request a GET, no dialog appeared and no page error',
      loadNewRequests.every(([,method])=>method==='GET')&&loadNewRequests.every(([url])=>!/health|host-?load|hostload|loop[_-]?lag/i.test(String(url)))&&
      loadNewRequests.every(([url])=>allowed.has(new URL(url,location.href).pathname))&&!d.querySelector('[role=dialog],dialog')&&fx.errors.length===0);
  } catch(e) {
    checks.push({name:e.message,passed:false});
    try{diagnostics={status:d?d.getElementById('sessions-status')?.textContent:null,filter:d?d.getElementById('sessions-filter-status')?.textContent:null,
      labels:d?[...d.querySelectorAll('#sessions-list > .session-group > h3')].map(h=>h.textContent).join('|'):null,
      listText:d?d.getElementById('sessions-list')?.textContent.slice(0,800):null,ocItems:d?d.querySelectorAll('.oc-item').length:null,
      glanceHtml:d?d.querySelector('.oc-glance')?.outerHTML.slice(0,700):null,
      pages:fx.sessionPages,ocReads:fx.ocReads,glances:fx.glanceReads,subagents:fx.subagentReads,previewCalls:fx.previewCalls,
      errors:fx.errors,requests:fx.requests.slice(0,10)};}catch(_){diagnostics='unavailable';}
  }
  document.getElementById('results').textContent=JSON.stringify({passed:checks.filter(x=>x.passed).length,failed:checks.filter(x=>!x.passed).length,checks,diagnostics},null,2);
  document.body.dataset.testPassed=String(checks.every(x=>x.passed));
})();
</script>
