    check('desktop embed',d.documentElement.dataset.viewEmbed==='desktop');
    await pickerChecks('desktop',24);
    if(SHOT==='pickers-desktop'){api.toggleControls(true);g('pick').open=true;g('dock-box').open=true;shot('pickers-desktop');}
    frameEl.id='page';frameEl.style.width='390px';frameEl.style.height='844px';
    // --- a partial catalog (no tab): the groups say why, a raw node still renders
    fx.catalog={status:200,body:{schemaVersion:1,docks:[],groups:[],errors:[{source:'groups',error:NO_TAB+' no live Workflowy tab'},{source:'docks',error:NO_TAB+' no live Workflowy tab'}],readAt:'x'}};
    await load();
    check('without a tab the catalog says why, outside the Controls bar (seen with it folded), and nothing blocks a pasted handle',g('catalog-errors').textContent.startsWith('Slice groups unavailable: '+NO_TAB)&&
      g('catalog-errors').closest('#g-status')&&!g('catalog-errors').closest('#g-ctl')&&(api.toggleControls(false),g('catalog-errors').getClientRects().length>0)&&!g('handle').disabled);
    g('handle').value='3f3754e2';g('handle-render').click();await settled();
    check('… and the raw node renders',api.state.held?.label==='Node · 3f3754e2'&&!!doc.isConnected&&g('doc').querySelector('h1'));
    fx.catalog={status:502,body:{schemaVersion:1,status:'daemon',error:'daemon unreachable'}};
    await load();
    check('a failed catalog read is a line, not a blocker',g('catalog-errors').textContent==='Docks and groups unavailable (a pasted handle still works) · daemon unreachable');
    // --- a missing renderer file: named, with the pane's own diagnostic; no substitute renderer
    fx.assetReply=p=>p.includes('MISSING')?new Response(JSON.stringify({schemaVersion:1,status:'request',error:'Missing NEXUS asset glimpse-md-render-MISSING.js in checkout /x; set nexus_checkout in ~/.config/opencode-companion/pane-glimpse.json, then restart pane'}),{status:404}):null;
    await load(t=>t.replace('/nexus-md/glimpse-md-render.js','/nexus-md/glimpse-md-render-MISSING.js'));
    await until(()=>g('assets').textContent.includes('Missing NEXUS asset'),'asset diagnostic');
    check('a missing renderer file is named on a plain line with the setting and the pane\'s diagnostic; GlimpseMd absent, no fallback',!g('assets').hidden&&
      g('assets').textContent.includes('/nexus-md/glimpse-md-render-MISSING.js')&&g('assets').textContent.includes('pane-glimpse.json')&&!w.GlimpseMd);
    g('handle').value='3f3754e2';g('handle-render').click();await settled();
    check('a render still holds the Markdown (Copy MD works) but nothing paints it',api.state.held?.markdown===md&&g('doc').textContent.startsWith('Cannot paint: the shared renderer did not load'));
    check('no page error anywhere ['+fx.errors.filter(e=>!/no-such-image|MISSING/.test(e)).join('; ')+']',!fx.errors.filter(e=>!/no-such-image|MISSING|resource error/.test(e)).length);
  } catch(e) { if(!checks.some(c=>!c.passed))checks.push({name:'fixture: '+e.message,passed:false}); }
  document.getElementById('results').textContent=JSON.stringify({passed:checks.filter(x=>x.passed).length,failed:checks.filter(x=>!x.passed).length,checks},null,2);
  document.body.dataset.testPassed=String(checks.length>0&&checks.every(x=>x.passed));
})();
</script>
