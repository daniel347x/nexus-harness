      sort_by:'none',sort_direction:'asc',since:null,recent_by:null,headings_only:false,ancestor_notes:false,full_uuids:false,as_markdown:true,content_format:'markdown',tree_mode:'render_tree'};

    const large=['# MCI ledger · all entries',...Array.from({length:640},(_,i)=>'## Entry '+(i+1)+' · ledger item\n\nRecorded change '+(i+1)+': **reviewed**, see [ap:L'+(1000+i)+'].')].join('\n\n');
    const viewMock=`
      ${wide?"Object.defineProperty(window,'parent',{configurable:true,value:window});":''}
      const store=new Map();Object.defineProperty(window,'localStorage',{configurable:true,value:{get length(){return store.size;},key:i=>[...store.keys()][i]??null,
        getItem:k=>store.get(k)??null,setItem:(k,v)=>store.set(k,String(v)),removeItem:k=>store.delete(k)}});
      Object.defineProperty(navigator,'clipboard',{configurable:true,value:{writeText:async()=>{}}});
      const realFetch=window.fetch.bind(window),json=(status,body)=>new Response(JSON.stringify(body),{status,headers:{'Content-Type':'application/json'}});
      const docs=${JSON.stringify({doc,large,rows,spec,focused,catalog})};
      window.fetch=async(url,options={})=>{const u=new URL(String(url),${JSON.stringify(location.href)});
        if(u.pathname.startsWith('/nexus-md/'))return realFetch(url,options);
        if(u.pathname==='/api/glimpse/catalog')return json(200,{schemaVersion:1,docks:docs.catalog.docks,groups:docs.catalog.groups,errors:[],readAt:'x'});
        if(u.pathname==='/api/glimpse/render'){const body=JSON.parse(options.body);
          const full=body.value.group==='grp-mci'?docs.large:docs.doc,markdown=body.value.focus?docs.focused:body.options.headings_only?full.split('\\n').filter(l=>l.startsWith('#')).join('\\n\\n'):full;
          const rowList=body.options.include_rows&&body.value.group!=='grp-mci'?{rows:docs.rows,render_spec:body.value.focus?body.value:
            {...docs.spec,sort_by:body.options.sort_by||'none',sort_direction:body.options.sort_direction||'asc',headings_only:!!body.options.headings_only}}:{};
          return json(200,{schemaVersion:1,markdown,bytes:new TextEncoder().encode(markdown).length,renderedAt:new Date().toISOString(),request:body,...rowList});}
        throw new Error('offline fixture: '+url);};`;
    const viewPage=viewHtml.replace('<script>',()=>'<script>'+safe(viewMock)+'<\/script>\n  <script>')
      .replace(/(src|href)="\/((?:glimpse|glare|view-history|view-pickers|handle-links)\.(?:js|css))"/g,(_,a,f)=>a+'="/transcription-pane/static/'+f+'"');
    let view=el('glimpse-frame');
    if(wide){view=frame;frame.style.width='1280px';frame.style.height='900px';}
    const viewed=new Promise(r=>view.onload=r);view.srcdoc=viewPage;if(!wide)el('view-glimpse').click();await viewed;
    const gw=view.contentWindow,gd=view.contentDocument,g=id=>gd.getElementById('g-'+id);
    check('the View page loads the shared renderer and the catalog',await until(()=>gw.GlimpseMd&&gw.opcGlimpseView&&g('dock').querySelectorAll('.g-pleaf').length===catalog.docks.length));
    const gapi=gw.opcGlimpseView,pick=async(id,i,label)=>{g(id+'-box').open=true;[...g(id).querySelectorAll('.g-pleaf')].find(b=>b.title===catalog[id+'s'][i].name).click();
      return until(()=>!gapi.state.busy&&gapi.state.held?.label.startsWith(label));};
    if(pickers){
      // The chooser open on one picker: the Docks nested as the extension nests them, or the slice groups' sections with
      // Work, its Conversational section and OpenCode opened (one row per entry, the long names scrolling sideways).
      g('pick').open=true;g(shot==='glimpse-docks'?'dock-box':'group-box').open=true;
      const open=label=>[...g('group').querySelectorAll('.g-pexp')].find(b=>b.textContent.endsWith(label)&&b.getAttribute('aria-expanded')==='false')?.click();
      if(shot==='glimpse-groups'){open('Work');open('Conversational');open('OpenCode');}
      const rows=[...g(shot==='glimpse-docks'?'dock':'group').querySelectorAll('.g-prow')],list=g(shot==='glimpse-docks'?'dock':'group');
      check('one unwrapped row per entry, the list the chooser\'s full width, long names scrolling sideways ('+rows.length+' rows)',rows.length>=12&&
        rows.every(b=>b.getBoundingClientRect().height<40)&&list.scrollWidth>list.clientWidth&&gd.documentElement.scrollWidth<=gd.documentElement.clientWidth+1&&
        list.getBoundingClientRect().width>=g('pick').getBoundingClientRect().width-24);
      if(shot==='glimpse-docks')check('nested: a Dock under its parent Dock sits further right',Number(rows[1].dataset.depth)===1&&
        rows[1].getBoundingClientRect().left===rows[0].getBoundingClientRect().left&&parseFloat(rows[1].style.paddingLeft)>parseFloat(rows[0].style.paddingLeft));
    }
    else if(shot==='glimpse-large'){check('a large group rendered',await pick('group',0,'Group'));
      const box=g('scroll');box.scrollTop=box.scrollHeight;await sleep(30);
      check('its first bound and Show all ('+g('more-text').textContent+')',!g('more').hidden&&/^Showing 200 of [\d,]+ blocks/.test(g('more-text').textContent));}
    else {check('a favorite Dock rendered',await pick('dock',1,'Dock'));
      if(!wide)check('compact by default on the phone, labelled, with Full',!g('compact').hidden&&gapi.state.held.request.options.headings_only===true);
      if(shot!=='glimpse-compact'&&!wide){g('full').click();check('Full renders the whole Dock',await until(()=>!gapi.state.busy&&gapi.state.held.request.options.headings_only===false&&g('compact').hidden));}
      check('table, math and raw HTML drawn by the shared renderer, no sideways page',shot==='glimpse-compact'||(g('doc').querySelector('table')&&g('doc').querySelector('.katex')&&
        gd.documentElement.scrollWidth<=gd.documentElement.clientWidth+1&&d.documentElement.scrollWidth<=d.documentElement.clientWidth+1));
      check('the Dock\u2019s row list sits above the document, painted by the shared renderRowList',!g('rows-box').hidden&&gd.querySelectorAll('#g-rows .glimpse-md-dock-row').length===12);
      if(shot==='glimpse-rows'){g('sort').value='modified';g('sort').dispatchEvent(new gw.Event('change'));
        check('by modified, newest first: the dock\u2019s day lines',await until(()=>!gapi.state.busy&&gapi.state.held.spec?.sort_by==='modified'&&gd.querySelector('#g-rows .glimpse-md-dock-daysep')));
        [...gd.querySelectorAll('#g-rows .glimpse-md-dock-row')].find(r=>r.textContent.includes('Leg 3')).click();
        check('a tapped row: its focused view, the row selected in the whole list',await until(()=>!gapi.state.busy&&/› ⚖️ RESULT · S · Leg 3/.test(gapi.state.held.label)&&
          gd.querySelector('#g-rows .glimpse-md-dock-row.selected')?.textContent.includes('Leg 3')));}
      if(shot==='glimpse-source'){const f=g('find');f.value='Dan';f.dispatchEvent(new gw.Event('input'));
        check('Source with find: count and current ('+g('count').textContent+')',gapi.state.view==='source'&&/^1 \/ \d+$/.test(g('count').textContent));}
      // History: a lead seat's socket tapped in Programs (resumed under a later Conductor: two sessions on one socket),
      // then two handles tapped in its document; the strip, the sheet, or the root's pop-up.
      if(shot.startsWith('glimpse-history')||shot==='glimpse-root'){
        const prog={key:'p:Z362II',core:'Z362II',title:'MCI · single server',kind:'full',managerSession:'207',count:40,conductors:32};
        const ln=(id,role,handle,name,status='')=>({id,key:'s:'+id,role,handle,name,status});
        const position={handle:'[ap:2IWU76]',kind:'socket',total:2,cards:[
          {id:'cc-seat-31',active:true,program:prog,manager:'207',chain:[ln('cc-c31','Conductor','[ap:Z362II]-031',''),ln('cc-seat-31','Lead seat','[ap:2IWU76]','RECON · Pre-pass · Waypoint 2 CLEAN wave-end instrument','Claude Code · Opus 5.5')]},
          {id:'cc-seat-32',active:false,program:prog,manager:'207',chain:[ln('cc-c32','Conductor','[ap:Z362II]-032','resumed'),ln('cc-seat-32','Lead seat','[ap:2IWU76]','RECON · Pre-pass · Waypoint 2 CLEAN wave-end instrument','Claude Code · running now')]}]};
        await gapi.openHandle('[ap:2IWU76]','node',{from:'programs',active:'cc-seat-31',where:'Programs',position});await until(()=>!gapi.state.busy);
        await gapi.openFromPage('[ap:BPQUKH]',{node:g('doc')});await until(()=>!gapi.state.busy);
        await gapi.openFromPage('[ap:XGEX2E]',{node:g('doc')});await until(()=>!gapi.state.busy);
        g('back').click();await until(()=>!gapi.state.busy);
        check('the history strip: the root widget and ‹ 2/3 ›',!g('hist').hidden&&!g('hist-nav').hidden&&g('now').textContent.startsWith('2/3'));
        if(shot==='glimpse-history-sheet'){g('hist-open').click();check('the sheet lists three cards',gd.querySelectorAll('#g-hist-list .g-hcard').length===3);}
        if(shot==='glimpse-root'){g('root').click();check('the root\u2019s pop-up: two cards, the tapped one first',gd.querySelectorAll('#g-pos-body .g-pos-card').length===2&&
          gd.querySelector('#g-pos-body .g-pos-card').classList.contains('g-pos-active'));}
      }}
    if(glare)check('the View frame follows the page\u2019s glare mode',gd.documentElement.dataset.glare==='on');
    glimpseFrame=view;
  }
  await sleep(200);
  // Glare mode is universal: every piece of text drawn on the page (and in its Programs frame) is bright, at full opacity.
  // Reds and greens that carry a meaning (an error, a live state) are allowed down to a lower floor. Without glare,
  // &sweep=1 only counts what the same rule finds (the before picture).
  if(glare || new URLSearchParams(location.search).has('sweep')){
    // rgb()/rgba() in 0–255, color(srgb …) (a color-mix result) in 0–1.
    const rgba=c=>{const v=c.match(/[\d.]+/g).map(Number),k=c.startsWith('color(')?255:1;return [v[0]*k,v[1]*k,v[2]*k,v[3] ?? 1];};
    const lum=c=>{const [r,g,b]=rgba(c).slice(0,3).map(v=>{v/=255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4;});return .2126*r+.7152*g+.0722*b;};
    const sweep=(doc,win)=>{const out=[];
      for(const n of doc.querySelectorAll('body *')){
        // A chess board's pieces and coordinates are drawn on its own light and dark squares, not on the page.
        // So is the View page's current find match: dark text on its own bright amber.
        if(!n.getClientRects().length || n.closest('[hidden],button:disabled,.opc-chess-grid,mark.glimpse-dock-src-hit--current') || ![...n.childNodes].some(t=>t.nodeType===3&&t.textContent.trim()))continue;
        const cs=win.getComputedStyle(n);if(cs.visibility==='hidden')continue;
        // An opening sheet's own fade-in (the tune sheet) ends at full opacity; any other faded ancestor counts.
        let o=rgba(cs.color)[3];for(let a=n;a&&a.nodeType===1;a=a.parentElement){const as=win.getComputedStyle(a);if(as.animationName==='none')o*=Number(as.opacity);}
        const l=lum(cs.color),hue=rgba(cs.color).slice(0,3),tinted=Math.max(...hue)-Math.min(...hue)>60;
        if(o<0.95 || l<(tinted?0.3:0.55))out.push((n.id?'#'+n.id:n.tagName.toLowerCase()+'.'+[...n.classList].join('.'))+' '+cs.color+(o<0.95?' α'+o.toFixed(2):'')+' «'+n.textContent.trim().slice(0,24)+'»');}
      return [...new Set(out)];};
    const dimPage=sweep(d,w),pf=el('programs-frame'),dimFrame=pf?.contentDocument?.body?sweep(pf.contentDocument,pf.contentWindow):[];
    const gf=glimpseFrame,dimView=gf?.contentDocument?.body?sweep(gf.contentDocument,gf.contentWindow):[];
    if(!glare)check('without glare: '+dimPage.length+' dim texts on the page, '+dimFrame.length+' in the Programs frame, '+dimView.length+' in the View frame',true);
    else {check('glare: no dim text on the page'+(dimPage.length?' — '+dimPage.join(' | '):''),!dimPage.length);
      check('glare: no dim text in the Programs frame'+(dimFrame.length?' — '+dimFrame.join(' | '):''),!dimFrame.length);
      check('glare: no dim text in the View frame'+(dimView.length?' — '+dimView.join(' | '):''),!dimView.length);}
  }
  const report=document.createElement('script');report.type='application/json';report.id='shot-report';report.textContent=JSON.stringify({shot:fullShot,checks});document.body.append(report);
})();
