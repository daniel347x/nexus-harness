      w.getComputedStyle(toast()).borderTopColor==='rgb(255, 129, 120)'&&!overlaps(errToast,rect(box))&&!overlaps(errToast,rect(actions()))&&

      if(maximized)el('draft-max').click();
    }
    // ---- rotation: 844×390 is still a phone layout (its smaller LAYOUT dimension is 390)
    await device(844,390);
    await edit(longDraft);
    const rotBox=rect(box),rotConvo=rect(conversation()),rotActions=rect(actions());
    const rotPage=d.documentElement.scrollHeight;
    w.scrollTo(0,rotPage);const rotActionsReachable=rect(actions());
    const rotReach=rotActionsReachable.top>=0&&rotActionsReachable.bottom<=w.innerHeight+1;w.scrollTo(0,0);
    const rotVisible=Math.min(rotConvo.bottom,w.innerHeight)-Math.max(rotConvo.top,0);
    check('rotated to 844×390 the phone rule still holds: the box is three lines, the buttons are reachable, no sideways scroll ['+
      [Math.round(rotBox.height),Math.round(rotConvo.height),Math.round(rotVisible),Math.round(rotActions.bottom),rotPage,w.innerWidth,w.innerHeight].join(' / ')+']',
      w.innerWidth===844&&w.innerHeight===390&&w.matchMedia('(pointer: coarse)').matches&&Math.abs(rotBox.height-shortH)<=1&&box.scrollHeight>box.clientHeight*6&&
      rotActions.left>=0&&rotActions.right<=844&&rotReach&&rotVisible>=100&&d.documentElement.scrollWidth<=845);
    await setNote('Rotated status note.',false);await sleep(80);
    const rotToast=rect(toast()),rotDraft2=rect(box);
    check('in landscape the note is still a toast over the conversation, never over the text box',toast().dataset.visible==='true'&&
      rotToast.top>=rotConvo.top-1&&rotToast.bottom<=rotConvo.bottom+1&&rotToast.left>=rotConvo.left-1&&rotToast.right<=rotConvo.right+1&&
      !overlaps(rotToast,rotDraft2)&&!overlaps(rotToast,rotActions));
    await setNote('',false);
    // ---- iPad Mini 744×1133: the growing editor, even when the keyboard's visual viewport is under 500
    await device(744,1133);
    await edit('short');await sleep(80);
    const padShort=rect(box).height;
    await edit(longDraft);
    const padLong=rect(box).height;
    check('iPad Mini 744×1133 keeps autosizing: the box grows with its text to its CSS cap ['+[Math.round(padShort),Math.round(padLong)].join(' → ')+']',
      w.innerWidth===744&&w.innerHeight===1133&&padShort<120&&padLong>padShort+100&&padLong<=w.innerHeight*.38+2&&box.scrollHeight>box.clientHeight);
    box.focus();await sleep(80);frame.contentWindow.__keyboard(true);await sleep(220);
    const padKeyboard=rect(box).height;
    check('an iPad keyboard\'s visual viewport under 500 px must NOT make it a phone editor: the layout viewport decides ['+
      [Math.round(padKeyboard),Math.round(padLong),d.body.dataset.thumb,w.getComputedStyle(page()).position].join(' / ')+']',
      Math.abs(padKeyboard-padLong)<=1&&d.body.dataset.thumb==='on'&&w.getComputedStyle(page()).position==='fixed'&&
      d.documentElement.scrollWidth<=745);
    box.blur();frame.contentWindow.__keyboard(false);await sleep(120);
    // ---- and back: the media-query change refits the phone box at once
    await device(390,844);
    await edit(longDraft);
    check('back on the iPhone the fixed three-line box returns and the draft scrolls inside it',Math.abs(rect(box).height-shortH)<=1&&box.scrollHeight>box.clientHeight*6&&
      Math.abs(rect(conversation()).height-convoAtRest)<=2);
    check('no real transport was attempted and the actual scripts had no uncaught errors',fixture.errors.length===0&&
      fixture.requests.every(([url])=>url.startsWith('/api/claude/')||url.startsWith('/api/usage')));
  } catch(e) { checks.push({name:e.message,passed:false}); }
  document.getElementById('results').textContent=JSON.stringify({passed:checks.filter(x=>x.passed).length,failed:checks.filter(x=>!x.passed).length,checks},null,2);
  document.body.dataset.testPassed=String(checks.length>0&&checks.every(x=>x.passed));
})();
</script>
