      sendIntents().at(-1).original==='Sub-session 226-a of Manager-Session-226.\n\nReason for this sub-session: the Claude host is down'&&
      sendIntents().at(-1).target.sessionId===api.state.selected&&api.state.selected===fx.ops.get(crisisLaunch.operationId)?.nativeId);
    check('… with the sub-session box closed, the draft untouched and no Claude host launch or Send ['+fx.claudeHost.join(', ')+']',
      el('sub-form').hidden&&box.value==='Phone crisis draft.'&&!fx.claudeHost.some(p=>/launch-manager|\/send$|reconnect/.test(p))&&
      !fx.requests.some(([u])=>u.startsWith('/api/claude/launch-manager')));
    await api.openNewManager();
    check('＋ New Manager takes the same controls back, still on the choice made in the ↳ box',el('new-choices-slot').contains(choicesM)&&
      el('sub-form').hidden&&!el('new-form').hidden&&el('new-runtime').value==='opencode'&&el('new-agent').value==='manager-gpt');
    fx.claudeDown=false;

    check('no fixture/script error escaped during the run',fx.postErrors.length===0);
    const passed=checks.filter(c=>c.passed).length;
    document.body.dataset.testPassed=String(checks.every(c=>c.passed));
    document.getElementById('results').textContent=JSON.stringify({passed,failed:checks.length-passed,total:checks.length,checks},null,1);
    window.__checks=checks;
  }catch(e){
    document.body.dataset.testPassed='false';
    document.getElementById('results').textContent=JSON.stringify({passed:checks.filter(c=>c.passed).length,failed:checks.length-checks.filter(c=>c.passed).length,total:checks.length,error:String(e&&e.stack||e),checks},null,1);
    window.__checks=checks;window.__error=String(e&&e.stack||e);
  }
})();
</script>
