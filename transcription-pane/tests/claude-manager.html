    Object.assign(lastReceipt(),{queued:true,status:'queued'});await api.pollClaudeManager();
    check('queued steer clears the unchanged draft and reads queued, not delivered',
      box.value===''&&/^Steer .* queued yes · delivered no/.test(el('claude-send-receipt').textContent));
    draft('second thought while queued');await api.sendClaude();
    check('one steer in flight: a second busy Send waits for delivery, draft kept, nothing posted',
      posts().length===steerPosts+1&&box.value==='second thought while queued'&&/previous message is queued for the Manager, not delivered yet/.test(el('status').textContent));
    await ack({delivered:true,status:'delivered'});
    check('the steer\'s exact echo confirms delivery and never clears the newer draft',
      /queued yes · delivered yes/.test(el('claude-send-receipt').textContent)&&box.value==='second thought while queued'&&posts().length===steerPosts+1);
    // Audit #3: a scheduled recovery no longer refuses. Busy, the Send goes as one steer and the host decides
    // (it supersedes the recovery, or says it is sending right now); nothing reads "crash recovery is pending".
    draft('busy Manager gets this too');inert.pendingRecovery='rec-1';await api.pollClaudeManager();const recoveryPosts=posts().length;
    await api.sendClaude();
    check('a scheduled recovery no longer refuses a busy Send: one steer posted, and the panel says Send replaces the recovery',
      posts().length===recoveryPosts+1&&posts().at(-1).body.steer===true&&
      !/crash recovery is pending/.test(el('status').textContent+el('claude-manager-observation').textContent)&&
      /your Send replaces its “continue”/.test(el('claude-manager-observation').textContent));
    await ack({delivered:true,status:'delivered'});
    draft('busy Manager keeps this draft');const busyPosts=posts().length;
    el('claude-wait').click();await sleep(20);
    check('explicit Wait preserves the draft and sends nothing, no hidden queue',posts().length===busyPosts&&box.value==='busy Manager keeps this draft'&&!inert.requests.some(r=>r.body?.delivery==='queue'));
    const controlsBefore=controlPosts().length,providerBefore=JSON.stringify([...inert.store].filter(([k])=>k.startsWith('refine_')));box.focus();el('claude-interrupt-now').click();
    await until(()=>controlPosts().length===controlsBefore+1&&!api.state.claudeControlSending);
    check('Interrupt is a deliberate native control, never draft Send',controlPosts().at(-1).body.operation==='interrupt'&&posts().length===busyPosts&&box.value==='busy Manager keeps this draft');
    check('native control completion leaves dictation focus intact',d.activeElement===box);
    inert.busy=false;inert.pendingRecovery=null;await api.pollClaudeManager();
    el('claude-model').value='claude-sonnet-5-5';box.focus();el('claude-model-apply').click();await until(()=>controlPosts().length===controlsBefore+2&&!api.state.claudeControlSending);await api.pollClaudeManager();
    check('actual labeled Apply model gets native applied effective readback',controlPosts().at(-1).body.model==='claude-sonnet-5-5'&&/claude-sonnet-5-5/.test(el('claude-effective').textContent));
    el('claude-effort').value='high';box.focus();el('claude-effort-apply').click();await until(()=>controlPosts().length===controlsBefore+3&&!api.state.claudeControlSending);await api.pollClaudeManager();
    check('actual labeled Apply thinking gets native high readback',controlPosts().at(-1).body.effort==='high'&&/high/.test(el('claude-effective').textContent));
    check('all caller control UUIDs are persisted before native POST',inert.controlDurability.every(x=>x.saved?.requestId===x.body.requestId));
    check('native controls never mutate Refine provider/key/model/thinking settings',JSON.stringify([...inert.store].filter(([k])=>k.startsWith('refine_')))===providerBefore);
    check('native applied control receipt is visibly distinct from Send',/applied/i.test(el('claude-control-receipt').textContent)&&d.activeElement===box);
    inert.controlApplied=false;inert.loseControlPost=true;const pendingCount=controlPosts().length;await api.controlClaude('set_model','claude-opus-5-5');
    const pendingId=controlPosts().at(-1).body.requestId;await api.pollClaudeManager();await api.controlClaude('set_model','claude-opus-5-5');
    check('lost control reply is reconciled by exact requestId GET, not repeated native control',controlPosts().length===pendingCount+1&&inert.requests.some(r=>r.url.startsWith('/api/claude/control-receipt?')&&new URL(r.url,'http://inert').searchParams.get('requestId')===pendingId));
    check('pending control never claims applied Opus setting',!api.state.claudeControl.settled&&!/claude-opus-5-5/.test(el('claude-effective').textContent)&&el('claude-model-apply').disabled);
    inert.effective.model='claude-opus-5-5';Object.assign(inert.controls.get(pendingId),{state:'applied',status:'applied',applied:true,effective:{...inert.effective}});await api.pollClaudeManager();inert.controlApplied=true;
    check('later native applied readback settles the same durable control',api.state.claudeControl.settled&&/claude-opus-5-5/.test(el('claude-effective').textContent)&&controlPosts().length===pendingCount+1);
    for(const t of [worker,history]){
      await select(t);const count=posts().length,controlCount=controlPosts().length;draft('view-only draft');
      check(t.source+' '+(t.role||'history')+' has no Send/native controls',el('send-btn').disabled&&el('claude-model').disabled&&el('claude-effort').disabled&&el('claude-model-apply').disabled&&el('claude-effort-apply').disabled&&el('claude-interrupt-now').disabled);
      api.state.claudeTarget.capabilities={nativeInput:true,controls:true};api.renderTarget();await api.sendClaude();await api.controlClaude('set_model','claude-opus-5-5');
      check(t.source+' '+(t.role||'history')+' spoofed capabilities cannot authorize transport',posts().length===count&&controlPosts().length===controlCount&&box.value==='view-only draft');
    }
    await select();box.focus();await api.pollClaudeManager();
    check('background state/receipt observation never steals dictation focus',d.activeElement===box);
    check('full-width Manager controls remain within editor',el('claude-manager-panel').getBoundingClientRect().right<=el('pane-editor').getBoundingClientRect().right+1);
    frame.style.width='420px';await sleep(50);
    check('420px Manager controls wrap without horizontal overflow or crushed dictation '+JSON.stringify({page:d.documentElement.scrollWidth,frame:frame.clientWidth,draftHeight:box.clientHeight,
      panelRight:el('claude-manager-panel').getBoundingClientRect().right,overflow:[...d.body.querySelectorAll('*')].filter(n=>n.getBoundingClientRect().width&&n.getBoundingClientRect().right>frame.clientWidth+1).slice(0,12).map(n=>[n.id||n.className,Math.round(n.getBoundingClientRect().right)])}),
      d.documentElement.scrollWidth<=frame.clientWidth+1&&box.clientHeight>=100&&el('claude-manager-panel').getBoundingClientRect().right<=frame.clientWidth+1);
    {
      const root=el('claude-account'),details=root.querySelector('[data-account-details]');
      root.querySelector('[data-account="work"]').click();await sleep(20);
      const sheet=root.querySelector('.account-sheet').getBoundingClientRect();
      check('420px account quota sheet stays inside the page, with active login and view kept separate',details.open&&sheet.left>=0&&sheet.right<=frame.clientWidth+1&&
        d.documentElement.scrollWidth<=frame.clientWidth+1&&root.querySelector('[data-account="personal"]').dataset.active==='true');
      details.open=false;
    }
    // Batch B: a collected conversation sleeps, stays selectable, and Send reconnects it.
    await select(sleeping);
    check('collected Manager reads sleeping (reconnects on Send) and keeps Send enabled',
      /sleeping \(reconnects on Send\)/.test(el('backend-status').textContent)&&!el('send-btn').disabled);
    draft('reconnect this conversation 🙂');
    const beforeReconnect=posts().length;
    await api.sendClaude();
    check('Send to a sleeping Manager reconnects identity-only, then journals one new Send at the reborn generation',
      inert.reconnects.length===1&&Object.keys(inert.reconnects[0]).sort().join(',')==='backend,executionId,generation,schemaVersion,targetRef'&&
      inert.reconnects[0].generation===1&&inert.reconnects[0].targetRef===sleeping.targetRef&&
      posts().length===beforeReconnect+1&&posts().at(-1).body.generation===2&&posts().at(-1).body.targetRef===inert.rebound.targetRef);
    check('the reconnected Send keeps the draft until its exact ACK',box.value==='reconnect this conversation 🙂');
    await ack();
    check('exact ACK after the reconnect clears the unchanged draft',box.value==='');
    draft('corrupt journal must retain this recovered draft');const corruptCount=posts().length;inert.store.set(api.K.claudeSend,'{broken operation journal');
    await mount();await select();await api.sendClaude();
    check('corrupt persisted journal blocks Send after reload instead of guessing a new UUID',!!api.state.claudeJournalError&&posts().length===corruptCount&&box.value==='corrupt journal must retain this recovered draft');
    check('actual markup, provider mock and native fixtures have no script errors',inert.errors.length===0);
  }catch(e){checks.push({name:'fixture error: '+e.message,passed:false,stack:e.stack});}
  window.testResults={passed:checks.filter(x=>x.passed).length,failed:checks.filter(x=>!x.passed).length,
    originalBytes:window.inert?.durability[0]&&new TextEncoder().encode(inert.durability[0].body.original).length,
    sendPosts:window.inert?.durability.length,controlPosts:window.inert?.controlDurability.length,checks};
  document.body.dataset.testPassed=String(testResults.failed===0);document.getElementById('results').textContent=JSON.stringify(testResults,null,2);
})();
